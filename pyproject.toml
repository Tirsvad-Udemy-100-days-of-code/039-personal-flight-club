[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-club"
version = "0.1.0"
description = "Day 39 capstone: find cheap flights listed in a Google Sheet and send a WhatsApp message."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
dependencies = [
    "requests",
    "requests-cache",
    "python-dotenv",
]

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/039-personal-flight-club"
Documentation = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/039-personal-flight-club/wiki"
"Issue tracker" = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/039-personal-flight-club/issues"

[project.optional-dependencies]
whatsapp = ["pywhatkit"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-requests"]

[project.scripts]
flight-club = "flight_club.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
strict = true
python_version = "3.13"

# The shared CI quality job runs mypy without the project dependencies installed.
[[tool.mypy.overrides]]
module = ["requests", "requests_cache", "dotenv", "pywhatkit", "pytest"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
